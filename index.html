<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0 minimum-scale=1.0"
              name="viewport">
        <meta content="ie=edge" http-equiv="X-UA-Compatible">
        <title>Editor Test</title>

        <link href="https://fonts.googleapis.com" rel="preconnect">
        <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

        <link href="res/editor.css" rel="stylesheet">

        <script crossorigin="anonymous" src="https://kit.fontawesome.com/cb36336f7b.js"></script>
    </head>
    <body>
        <div class="editor-c" style="display: flex; flex-direction: row"></div>
        <div class="editor-c2"></div>
        <script type="module">
            import {TextRange} from "./src/editor/core/coordinate/range/TextRange";
            import {JsLexicalGrammar} from "./src/plugins/jsLang/lang/lexer/JsLexicalGrammar";
            import {JsGrammar} from "./src/plugins/jsLang/lang/parser/JsGrammar";
            import {JsParser} from "./src/plugins/jsLang/lang/parser/JsParser";
            import JSLangPlugin from "./src/plugins/jsLang/JSLangPlugin";
            import JsIncrLexer from "./src/plugins/jsLang/lang/lexer/JsIncrLexer";
            import {Source} from "./src/lang/syntax/builder/tokens/TokenStream";
            import {DocumentModificationEvent} from "./src/editor/core/document/events/DocumentModificationEvent";
            import {Project} from "./src/core/project/Project";
            import {ASTBuilder} from "./src/lang/syntax/builder/parser/builder/ASTBuilder";
            import {ShadowApp} from "./src/app/ShadowApp";
            import {RelativePath} from "./src/core/project/filesystem/path/RelativePath";
            import {EditorURI} from "./src/core/uri/EditorURI";
            import {JsCodeBlock} from "./src/plugins/jsLang/lang/syntax/JsCodeBlock";
            import {JsDeclarator} from "./src/plugins/jsLang/lang/syntax/statements/JsDeclarator";
            import {JsIdentifier} from "./src/plugins/jsLang/lang/syntax/literal/JsIdentifier";
            import {GlobalState} from "./src/core/global/GlobalState";
            import {ShadowUIFactory} from "./src/app/ui/ShadowUIFactory";
            import {CommonKeyImpl} from "./src/core/utils/CommonKey";
            import {ProjectChooserPane} from "./src/app/ui/full/panes/projectChooser/ProjectChooserPane";
            import {BlankPane} from "./src/app/ui/full/panes/blank/BlankPane";
            import {EditorTab} from "./src/app/core/tabs/EditorTab";
            import JsLang from "./src/plugins/jsLang/lang/JsLang";
            import {Document} from "./src/editor/core/document/Document";
            import {ProjectFilesPane} from "./src/app/ui/full/panes/projectFiles/ProjectFilesPane";
            import {SerializationUtils} from "./src/core/persistence/serializable/SerializationUtils";
            import {SimpleTooltipPopup} from "./src/editor/ui/popups/tooltip/SimpleTooltipPopup";
            import {SettingBase} from "./src/core/settings/base/SettingBase";
            import {JsSynVisitor} from "./src/plugins/jsLang/lang/syntax/visitors/JsSynVisitor";
            import {SynRecursiveVisitor} from "./src/lang/syntax/visitors/SynRecursiveVisitor";
            import {SynLazyVisitorOptimizer} from "./src/lang/syntax/visitors/SynLazyVisitorOptimizer";
            import DebugToolsPlugin from "./src/plugins/debugTools/DebugToolsPlugin";
            import {SourceRewriter} from "./src/lang/syntax/writer/SourceRewriter";
            import {SynModificationTree} from "./src/lang/syntax/writer/template/SynModificationTree";
            import {JsSynTemplate} from "./src/plugins/jsLang/lang/template/JsSynTemplate";
            import {SynSuiteWindowRenderer} from "./src/app/testLib/lang/suite/renderer/SynSuiteWindowRenderer";
            import {PopupUtilsCore} from "./src/core/ui/lib/popup/PopupUtilsCore";
            import {FaIcon} from "./src/core/ui/icons/FaIcon";
            import {ProjectFilesPaneHelper} from "./src/app/ui/full/panes/projectFiles/ProjectFilesPaneHelper";
            import {ActiveProjectHelper} from "./src/core/global/ActiveProjectHelper";
            import {UIComponent, UIComponentMixin} from "./src/core/ui/engine/components/UIComponent";
            import {Measurable} from "./src/core/ui/engine/mixins/Measurable";
            import {VNodeStore} from "./src/core/project/filesystem/metadata/VNodeStore";
            import {SpacingFormatter} from "./src/lang/codeStyle/spacing/SpacingFormatter";
            import {SynTreeOffsetJumper} from "./src/lang/codeStyle/utils/SynTreeOffsetJumper";
            import {SynASTElementImpl} from "./src/lang/syntax/impl/tree/SynASTElementImpl";
            import {JsSpacingRules} from "./src/plugins/jsLang/codeStyle/JsSpacingRules";

            window.VNodeStore = VNodeStore;

            window.disableTimebomb = () => {
                window["isParseTimeBombDisabled"] = true;
            }

            window.enableTimebomb = () => {
                window["isParseTimeBombDisabled"] = false;
            }

            window.disableTimebomb();

            window.FaIcon = FaIcon;
            window.SynASTElementImpl = SynASTElementImpl
            window.SimpleTooltipPopup = SimpleTooltipPopup;
            window.PopupUtilsCore = PopupUtilsCore;
            window.SourceRewriter = SourceRewriter;
            window.AbstractSynTemplate = JsSynTemplate;
            window.SynSuiteRender = SynSuiteWindowRenderer;
            window.SynModTree = SynModificationTree;

            window.ProjectFilesPaneHelper = ProjectFilesPaneHelper;

            console.log(SerializationUtils.getSerializableClassName(SettingBase))

            // Main entry point - launch the app and wait for startup to complete
            const app = await ShadowApp.launch(true);
            window.app = app;

            window.GlobalState = GlobalState;

            window.SpacingFormatter = SpacingFormatter.make(JsSpacingRules, [JsLexicalGrammar.WHITESPACE], [JsLexicalGrammar.EOL]);
            window.SynTreeOffsetJumper = SynTreeOffsetJumper;

            if (!app) {
                console.error("ShadowApp startup failed!");
            } else {
                // App is now fully initialized, safe to create project and editor
                const project = new Project("myProject");

                app.openProject(project);

                window.ui = await ShadowUIFactory.fullAppUI();

                app.enable(JSLangPlugin.class);
                app.enable(DebugToolsPlugin.class);

                window.CommonKeyImpl = CommonKeyImpl;
                window.ProjectPane = ProjectChooserPane;
                window.BlankPane = BlankPane;

                window.EditorTab = EditorTab;
                window.TM = GlobalState.getTabsManager();

                setTimeout(() => {
                    GlobalState.getPaneManager().open(new ProjectChooserPane());
                    GlobalState.getPaneManager().open(new ProjectFilesPane());
                }, 0);

                window.editor = ui.getMainEditor();

                window.project = project;
                window.ActiveProjectHelper = ActiveProjectHelper;
                window.TextRange = TextRange;
                window.SerializationUtils = SerializationUtils;

                window.EDoc = Document;
                window.JsLangPlugin = JSLangPlugin.class;
                window.JsLang = JsLang;
                window.JsVisitor = JsSynVisitor;
                window.SynRecursiveVisitor = SynRecursiveVisitor;
                window.SynLazyVisitorOptimizer = SynLazyVisitorOptimizer;

                window.JsGr = JsLexicalGrammar;
                window.JsIncrLex = JsIncrLexer;
                window.DocumentModificationEvent = DocumentModificationEvent;

                window.lex = new JsIncrLex();

                window.Source = Source;

                window.UIComponentMixin = UIComponentMixin;
                window.UIComponent = UIComponent;
                window.Measurable = Measurable;

                window.builder = ASTBuilder;

                window.JsAst = JsGrammar;

                window.JsCodeBlock = JsCodeBlock;
                window.JsDeclarator = JsDeclarator;
                window.JsIdentifier = JsIdentifier;

                window.Parser = JsParser;

                window.RelativePath = RelativePath;

                window.EditorURI = EditorURI;

                window.GlobalState = GlobalState;

                window.fill = (n = 1000) => {
                    let s = "";
                    for (let i = 0; i < n; i++) {
                        s += "let x = " + i + ";\n";
                    }
                    GlobalState.getMainEditor().insertText(0, s);
                }
            }

        </script>
    </body>
</html>
