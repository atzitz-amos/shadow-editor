<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0 minimum-scale=1.0"
              name="viewport">
        <title>Editor Test</title>

        <link href="https://fonts.googleapis.com" rel="preconnect">
        <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

        <link href="res/editor.css" rel="stylesheet">

        <script crossorigin="anonymous" src="https://kit.fontawesome.com/cb36336f7b.js"></script>

        <style>
            .test-editor {
                position: absolute;
                top: 300px;
                left: 100px;
                border: 1px solid var(--editor-dialog-border-color);
                box-shadow: 9px 8px 20px black;
            }
        </style>
    </head>

    <body>
        <div class="editor-c" style="display: flex; flex-direction: row"></div>

        <div class="editor-c2"></div>
        <script type="module">
            import {TextRange} from "./src/editor/core/coordinate/range/TextRange";
            import {JsLexicalGrammar} from "./src/plugins/jsLang/lang/lexer/JsLexicalGrammar";
            import {JsGrammar} from "./src/plugins/jsLang/lang/parser/JsGrammar";
            import {JsParser} from "./src/plugins/jsLang/lang/parser/JsParser";
            import JSLangPlugin from "./src/plugins/jsLang/JSLangPlugin";
            import JsIncrLexer from "./src/plugins/jsLang/lang/lexer/JsIncrLexer";
            import {Source} from "./src/lang/syntax/builder/tokens/TokenStream";
            import {DocumentModificationEvent} from "./src/editor/core/document/events/DocumentModificationEvent";
            import {Project} from "./src/core/project/Project";
            import {ASTBuilder} from "./src/lang/syntax/builder/parser/builder/ASTBuilder";
            import {ShadowApp} from "./src/app/ShadowApp";
            import {RelativePath} from "./src/core/project/filesystem/path/RelativePath";
            import {EditorURI} from "./src/core/uri/EditorURI";
            import {JsCodeBlock} from "./src/plugins/jsLang/lang/syntax/JsCodeBlock";
            import {JsDeclarator} from "./src/plugins/jsLang/lang/syntax/statements/JsDeclarator";
            import {JsIdentifier} from "./src/plugins/jsLang/lang/syntax/literal/JsIdentifier";
            import {GlobalState} from "./src/core/global/GlobalState";
            import {ShadowUIFactory} from "./src/app/ui/ShadowUIFactory";
            import {CommonKeyImpl} from "./src/core/utils/CommonKey";
            import {ProjectChooserPane} from "./src/app/ui/full/panes/projectChooser/ProjectChooserPane";
            import {BlankPane} from "./src/app/ui/full/panes/blank/BlankPane";
            import {EditorTab} from "./src/app/core/tabs/EditorTab";
            import JsLang from "./src/plugins/jsLang/lang/JsLang";
            import {Document} from "./src/editor/core/document/Document";
            import {ProjectFilesPane} from "./src/app/ui/full/panes/projectFiles/ProjectFilesPane";
            import {SerializationUtils} from "./src/core/persistence/serializable/SerializationUtils";
            import {SimpleTooltipPopup} from "./src/editor/ui/popups/tooltip/SimpleTooltipPopup";
            import {SettingBase} from "./src/core/settings/base/SettingBase";
            import {JsSynVisitor} from "./src/plugins/jsLang/lang/syntax/visitors/JsSynVisitor";
            import {SynRecursiveVisitor} from "./src/lang/syntax/visitors/SynRecursiveVisitor";
            import {SynLazyVisitorOptimizer} from "./src/lang/syntax/visitors/SynLazyVisitorOptimizer";
            import DebugToolsPlugin from "./src/plugins/debugTools/DebugToolsPlugin";
            import {SourceRewriter} from "./src/lang/syntax/writer/SourceRewriter";
            import {SynModificationTree} from "./src/lang/syntax/writer/template/SynModificationTree";
            import {SynSuiteWindowRenderer} from "./src/app/testLib/lang/suite/renderer/SynSuiteWindowRenderer";
            import {IdeDialogUtilsCore} from "./src/core/ui/lib/dialog/utils/IdeDialogUtilsCore";
            import {FaIcon} from "./src/core/ui/icons/FaIcon";
            import {ProjectFilesPaneHelper} from "./src/app/ui/full/panes/projectFiles/ProjectFilesPaneHelper";
            import {ActiveProjectHelper} from "./src/core/global/ActiveProjectHelper";
            import {UIComponent, UIComponentMixin} from "./src/core/ui/engine/components/UIComponent";
            import {Measurable} from "./src/core/ui/engine/mixins/Measurable";
            import {VNodeStore} from "./src/core/project/filesystem/metadata/VNodeStore";
            import {SynTreeOffsetJumper} from "./src/lang/codeStyle/utils/SynTreeOffsetJumper";
            import {SynASTElementImpl} from "./src/lang/syntax/impl/tree/SynASTElementImpl";
            import {EditorHighlighterUtils} from "./src/editor/ui/highlighter/overlay/EditorHighlighterUtils";
            import {TextAttributeKey} from "./src/editor/ui/highlighter/style/TextAttributeKey";
            import {TextBackground} from "./src/editor/ui/highlighter/style/TextBackground";
            import {ActionPopup} from "./src/core/ui/lib/dialog/action/ActionPopup";
            import {DebugToolsPopup} from "./src/plugins/debugTools/popup/DebugToolsPopup";
            import {MainEditorChangedEvent} from "./src/app/ui/events/MainEditorChangedEvent";
            import {SynDocumentManager} from "./src/lang/syntax/manager/SynDocumentManager";
            import {LanguageParserDefinition} from "./src/lang/definitions/LanguageParserDefinition";
            import {JsWhitespaceScrambler} from "./src/plugins/debugTools/popup/codeStyle/JsWhitespaceScrambler";
            import {JsCodeStyleManager} from "./src/plugins/jsLang/codeStyle/JsCodeStyleManager";
            import {QuickParseUtils} from "./src/lang/syntax/utils/QuickParseUtils";
            import {SettingsDialog} from "./src/app/ui/full/settings/dialog/SettingsDialog";
            import HTMLLangPlugin from "./src/plugins/htmlLang/HTMLLangPlugin";
            import {JsFunctionTemplate} from "./src/plugins/jsLang/lang/codeGen/template/JsFunctionTemplate";
            import {JsReturnStatement} from "./src/plugins/jsLang/lang/syntax/statements/JsReturnStatement";
            import {
                JsFunctionParameterListTemplate
            } from "./src/plugins/jsLang/lang/codeGen/template/JsFunctionParameterListTemplate";
            import {JsStatementTemplate} from "./src/plugins/jsLang/lang/codeGen/template/JsStatementTemplate";
            import {
                JsFunctionParameterTemplate
            } from "./src/plugins/jsLang/lang/codeGen/template/JsFunctionParameterTemplate";
            import {JsExprTemplate} from "./src/plugins/jsLang/lang/codeGen/template/expr/JsExprTemplate";
            import {SynModTree} from "./src/lang/codeGen/modification/SynModTree";
            import {JsSynTemplate} from "./src/plugins/jsLang/lang/codeGen/template/JsSynTemplate";
            import {LiveTemplateOverlay} from "./src/editor/ui/inline/live/LiveTemplateOverlay";
            import {LiveTemplateMode} from "./src/editor/core/live/LiveTemplateMode";
            import {LiveTemplate} from "./src/editor/core/live/LiveTemplate";
            import {SearchProcessor} from "./src/core/search/SearchProcessor";
            import {HTMLUtils} from "./src/editor/utils/HTMLUtils";
            import {LightEditor} from "./src/editor/light/LightEditor";
            import {DocumentView} from "./src/editor/core/document/view/DocumentView";
            import {EditorDocumentManager} from "./src/editor/core/document/EditorDocumentManager";
            import {LifecycleTerminatedEvent} from "./src/core/lifecycle/events/LifecycleTerminatedEvent";
            import {IdeFindDialog} from "./src/app/ui/full/search/IdeFindDialog";
            import RiscVAssemblyLangPlugin from "./src/plugins/riscvAssemblyLang/RiscVAssemblyLangPlugin";
            import {RiscV32LexicalGrammar} from "./src/plugins/riscvAssemblyLang/lang/lexer/Riscv32LexicalGrammar";
            import {DocumentViewManager} from "./src/editor/core/document/view/DocumentViewManager";

            window.QuickParseUtils = QuickParseUtils;

            window.SettingsDialog = SettingsDialog;

            window.SynModTree = SynModTree;
            window.SynDocumentManager = SynDocumentManager;

            window.JsFunctionTemplate = JsFunctionTemplate;
            window.JsReturnStatement = JsReturnStatement;
            window.JsStatementTemplate = JsStatementTemplate;
            window.JsFunctionParameterListTemplate = JsFunctionParameterListTemplate;
            window.JsFunctionParameterTemplate = JsFunctionParameterTemplate;
            window.JsExprTemplate = JsExprTemplate;

            GlobalState.whenAppReady(() => {
                setTimeout(() => {
                    //IdeDialogUtilsCore.showDialog(new IdeFindDialog());
                }, 2000)
            });

            window.searchAcrossFiles = async (q) => {
                const start = performance.now();
                let p = GlobalState.getCurrentProject()
                const results = [];
                for (const file of p.getFS().recursiveGetAllFiles()) {
                    const content = await file.getTextContent();
                    for (const line of content.split("\n")) {
                        if (line.includes(content)) {
                            results.push({
                                file: file.getPath().toString(),
                                line: line
                            });
                        }
                    }
                }
                console.log("perf", performance.now() - start)
                return results;
            }

            window.format = () => {
                const document = getSynDocument();
                const visitor = JsCodeStyleManager.getInstance().getFormattingBlockVisitor();
                const engine = JsCodeStyleManager.getInstance().getFormattingEngine();
                const result1 = engine.format(visitor.format(document.getTree(), document.getDocument().getTokenCache().createTokenStream()))
                const quickParse = QuickParseUtils.quickParse(document.getLanguage(), result1)
                const result2 = JsCodeStyleManager.getInstance().getSpacingFormatter().format(quickParse.tokenStream, quickParse.tree);

                return {
                    partial: result1,
                    final: result2
                }
            }

            window.LiveTemplateOverlay = LiveTemplateOverlay
            window.LiveTemplateMode = LiveTemplateMode;
            window.LiveTemplate = LiveTemplate;
            window.createLive = r => {
                const m = new LiveTemplateMode(r);
                m.setTemplateModifiedCallback((d, ra) => {
                    console.log("Modified: ", d.getTextBetween(ra.start, ra.end));
                });

                m.setTemplateRejectedCallback(() => console.log("Rejected"));
                m.setTemplateAcceptedCallback(ra => console.log("Accepted"));
                return m;
            }

            window.VNodeStore = VNodeStore;

            window.ActionPopup = ActionPopup;
            window.DebugTools = DebugToolsPopup;

            window.LanguageParserDefinition = LanguageParserDefinition;
            window.jsScramble = new JsWhitespaceScrambler();

            window.setTimeout(() => window.JsCodeStyleManager = JsCodeStyleManager.getInstance(), 500);

            window.getSynDocument = () => SynDocumentManager.getOpenedSynDocument(GlobalState.getMainEditor());


            window.highlight = (start, end) => {
                EditorHighlighterUtils.highlight(
                    GlobalState.getMainEditor(),
                    "debug-highlight",
                    TextAttributeKey.of(new TextBackground("rgb(69 77 73 / 50%)")),
                    null,
                    new TextRange(start, end)
                )
            }

            window.disableTimebomb = () => {
                window["isParseTimeBombDisabled"] = true;
            }

            window.enableTimebomb = () => {
                window["isParseTimeBombDisabled"] = false;
            }

            window.disableTimebomb();

            window.FaIcon = FaIcon;
            window.SynASTElementImpl = SynASTElementImpl
            window.SimpleTooltipPopup = SimpleTooltipPopup;
            window.IdeDialogUtilsCore = IdeDialogUtilsCore;
            window.SourceRewriter = SourceRewriter;
            window.AbstractSynTemplate = JsSynTemplate;
            window.SynSuiteRender = SynSuiteWindowRenderer;

            window.ProjectFilesPaneHelper = ProjectFilesPaneHelper;

            // Main entry point - launch the app and wait for startup to complete
            const app = await ShadowApp.launch(true);
            window.app = app;

            window.GlobalState = GlobalState;

            window.SynTreeOffsetJumper = SynTreeOffsetJumper;

            if (!app) {
                console.error("ShadowApp startup failed!");
            } else {
                // App is now fully initialized, safe to create project and editor
                const project = new Project("myProject");

                app.openProject(project);

                window.ui = await ShadowUIFactory.fullAppUI();

                app.enable(JSLangPlugin.class);
                app.enable(HTMLLangPlugin.class);
                app.enable(DebugToolsPlugin.class);
                app.enable(RiscVAssemblyLangPlugin.class);

                window.CommonKeyImpl = CommonKeyImpl;
                window.ProjectPane = ProjectChooserPane;
                window.BlankPane = BlankPane;

                window.EditorTab = EditorTab;
                window.TM = GlobalState.getTabsManager();

                setTimeout(() => {
                    GlobalState.getPaneManager().open(new ProjectChooserPane());
                    GlobalState.getPaneManager().open(new ProjectFilesPane());
                }, 0);

                window.editor = ui.getMainEditor();

                window.project = project;
                window.ActiveProjectHelper = ActiveProjectHelper;
                window.TextRange = TextRange;
                window.SerializationUtils = SerializationUtils;

                window.EDoc = Document;
                window.JsLangPlugin = JSLangPlugin.class;
                window.JsLang = JsLang;
                window.JsVisitor = JsSynVisitor;
                window.SynRecursiveVisitor = SynRecursiveVisitor;
                window.SynLazyVisitorOptimizer = SynLazyVisitorOptimizer;

                window.JsGr = JsLexicalGrammar;
                window.RiscV32LexicalGrammar = RiscV32LexicalGrammar;
                window.JsIncrLex = JsIncrLexer;
                window.DocumentModificationEvent = DocumentModificationEvent;

                window.lex = new JsIncrLex();

                window.Source = Source;

                window.UIComponentMixin = UIComponentMixin;
                window.UIComponent = UIComponent;
                window.Measurable = Measurable;

                window.builder = ASTBuilder;

                window.JsAst = JsGrammar;

                window.JsCodeBlock = JsCodeBlock;
                window.JsDeclarator = JsDeclarator;
                window.JsIdentifier = JsIdentifier;

                window.Parser = JsParser;

                window.RelativePath = RelativePath;

                window.EditorURI = EditorURI;

                window.GlobalState = GlobalState;

                window.fill = (n = 1000) => {
                    let s = "";
                    for (let i = 0; i < n; i++) {
                        s += "let x = " + i + ";\n";
                    }
                    GlobalState.getMainEditor().insertText(0, s);
                }
            }

        </script>
    </body>
</html>
